name: CI/CD Pipeline

oon:
  push:
    branches: [ "quinto_b" ]
  pull_request:
    branches: [ "quinto_b" ]

permissions:
  contents: read
  package: write

jobs:
  build:

    runs-on: ubuntu-latest
  
  steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      # CORRECCIÓN: Uso de sintaxis multi-línea (|) para ejecutar comandos separados.
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt # Asegúrate que el archivo se llama 'requirements.txt'


    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: ghcr.io/DavidVMuela/quinto_b:latest